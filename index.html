<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brate Coffee - Personel Takip</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

  <!-- 1. KAFE BİLGİSAYAR EKRANI: SADECE QR KOD -->
  <div id="pc-qr-screen" class="text-center bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 max-w-sm w-full">
    <h1 class="text-2xl font-bold mb-2 text-amber-500">Brate Coffee</h1>
    <p class="text-xs text-gray-400 mb-6">Giriş / Çıkış için QR kodu telefonunuzla okutun</p>
    
    <div class="bg-white p-4 rounded-xl flex justify-center items-center my-4 min-h-[220px]">
      <img id="qr-img" src="" alt="QR Kod Yükleniyor..." class="w-52 h-52 object-contain hidden" />
      <span id="qr-loading" class="text-gray-500 text-xs animate-pulse">QR Kod Hazırlanıyor...</span>
    </div>
    
    <p class="text-xs text-amber-400 font-mono mt-4">● Kod her 10 saniyede bir yenilenir</p>
  </div>

  <!-- 2. PERSONEL MOBİL EKRANI: ŞİFRE VE MESAİ PANELİ -->
  <div id="mobile-staff-screen" class="hidden bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700 max-w-sm w-full">
    
    <!-- PIN GiRİŞ ADIMI -->
    <div id="pin-section">
      <h2 class="text-xl font-bold text-center text-amber-500 mb-4">Personel Girişi</h2>
      <label class="block text-sm text-gray-300 mb-2">PIN Kodunuzu Girin:</label>
      <input type="password" id="staff-pin" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-lg text-center text-2xl tracking-widest text-white mb-4 focus:outline-none focus:border-amber-500" placeholder="****" maxlength="4">
      <button onclick="loginStaff()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-lg transition">Giriş Yap</button>
      <p id="login-error" class="text-red-400 text-xs text-center mt-3 hidden"></p>
    </div>

    <!-- MESAİ ADIMI (GİRİŞ YAPILINCA AÇILIR) -->
    <div id="shift-section" class="hidden">
      <div class="border-b border-gray-700 pb-3 mb-4 flex justify-between items-center">
        <div>
          <p class="text-xs text-gray-400">Personel</p>
          <h3 id="staff-name" class="text-lg font-bold text-amber-400"></h3>
        </div>
        <button onclick="logout()" class="text-xs text-gray-400 underline">Çıkış</button>
      </div>

      <div class="space-y-3 mb-6">
        <button onclick="submitShift('START')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg">
          İŞE BAŞLAYALIM
        </button>
        <button onclick="submitShift('STOP')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg">
          PAYDOS
        </button>
      </div>

      <div id="action-result" class="text-center text-sm font-semibold mb-4"></div>

      <!-- AYLIK MESAİ DÖKÜMÜ VE HAKEDİŞ -->
      <div class="bg-gray-700/50 p-4 rounded-xl border border-gray-600 text-xs space-y-2">
        <h4 class="font-bold text-gray-300 border-b border-gray-600 pb-1 mb-2">Bu Ayki Mesai Özeti</h4>
        <div class="flex justify-between text-gray-300">
          <span>Toplam Çalışma:</span>
          <span id="total-hours" class="font-bold text-white">0 Saat</span>
        </div>
        <div class="flex justify-between text-gray-300">
          <span>Hak Edilen Ücret:</span>
          <span id="total-earned" class="font-bold text-amber-400">0 TL</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://personel-mesai-api.bratecoffee35.workers.dev";
    const urlParams = new URLSearchParams(window.location.search);
    const qrTokenFromUrl = urlParams.get('token');

    // Cihaz Yönlendirmesi
    if (qrTokenFromUrl) {
      document.getElementById('pc-qr-screen').classList.add('hidden');
      document.getElementById('mobile-staff-screen').classList.remove('hidden');
    } else {
      startQrLoop();
    }

    // GÜVENİLİR DİNAMİK QR ÜRETİCİ (Resim API Yöntemi)
    let qrInterval;
    function startQrLoop() {
      clearInterval(qrInterval);
      const fetchQr = async () => {
        try {
          const res = await fetch(`${API_URL}/api/qr/generate`);
          const data = await res.json();
          if (data.success) {
            const scanUrl = encodeURIComponent(`${window.location.origin}${window.location.pathname}?token=${data.token}`);
            const qrImg = document.getElementById('qr-img');
            const qrLoading = document.getElementById('qr-loading');

            // QuickChart QR API ile anında resim oluştur
            qrImg.src = `https://quickchart.io/qr?text=${scanUrl}&size=220&margin=1`;
            qrImg.onload = () => {
              qrImg.classList.remove('hidden');
              if(qrLoading) qrLoading.classList.add('hidden');
            };
          }
        } catch(e) {
          console.error("QR üretilemedi", e);
        }
      };
      fetchQr();
      qrInterval = setInterval(fetchQr, 10000);
    }

    // PERSONEL ŞİFRE GİRİŞİ
    async function loginStaff() {
      const pin = document.getElementById('staff-pin').value;
      const errDiv = document.getElementById('login-error');
      if (!pin) { errDiv.innerText = "PIN giriniz"; errDiv.classList.remove('hidden'); return; }

      const res = await fetch(`${API_URL}/api/staff/my-summary`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin_code: pin })
      });
      const data = await res.json();

      if (data.success) {
        document.getElementById('pin-section').classList.add('hidden');
        document.getElementById('shift-section').classList.remove('hidden');
        document.getElementById('staff-name').innerText = data.staff_name;

        let hours = 0, earned = 0;
        if(data.shifts) {
          data.shifts.forEach(s => {
            hours += s.total_hours || 0;
            earned += s.earned_amount || 0;
          });
        }
        document.getElementById('total-hours').innerText = `${hours.toFixed(1)} Saat`;
        document.getElementById('total-earned').innerText = `${earned.toFixed(2)} TL`;
      } else {
        errDiv.innerText = "Hatalı PIN Kodu!";
        errDiv.classList.remove('hidden');
      }
    }

    // İŞE BAŞLAYALIM VE PAYDOS İŞLEMLERİ
    async function submitShift(actionType) {
      const pin = document.getElementById('staff-pin').value;
      const resDiv = document.getElementById('action-result');
      resDiv.innerHTML = `<span class="text-amber-400">Konum kontrol ediliyor...</span>`;

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const res = await fetch(`${API_URL}/api/shift/action`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            pin_code: pin,
            token: qrTokenFromUrl,
            user_lat: pos.coords.latitude,
            user_lng: pos.coords.longitude,
            action_type: actionType
          })
        });
        const data = await res.json();
        if (data.success) {
          resDiv.innerHTML = `<span class="text-green-400">${data.message}</span>`;
          setTimeout(() => { loginStaff(); }, 2000);
        } else {
          resDiv.innerHTML = `<span class="text-red-400">${data.error}</span>`;
        }
      }, (err) => {
        resDiv.innerHTML = `<span class="text-red-400">Konum alınamadı. Lütfen telefondan GPS/Konum izni verin.</span>`;
      });
    }

    function logout() {
      window.location.href = window.location.pathname;
    }
  </script>
</body>
</html>
