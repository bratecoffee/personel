<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brate Coffee - Mesai Takip Sistemi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <nav class="bg-amber-900 text-white p-4 flex justify-between items-center shadow-lg">
    <h1 class="text-xl font-bold">Brate Coffee - Mesai Takip</h1>
    <div class="space-x-2">
      <button onclick="showScreen('qr-display')" class="bg-amber-700 px-3 py-1 rounded text-sm">Kafe Ekranı (QR)</button>
      <button onclick="showScreen('scanner')" class="bg-amber-700 px-3 py-1 rounded text-sm">Personel Giriş</button>
      <button onclick="showScreen('admin')" class="bg-amber-700 px-3 py-1 rounded text-sm">Yönetici</button>
    </div>
  </nav>

  <div class="container mx-auto p-4 max-w-md">

    <!-- 1. KAFE KONTROL EKRANI (DİNAMİK QR) -->
    <div id="qr-display" class="screen bg-white p-6 rounded-lg shadow-md text-center">
      <h2 class="text-lg font-bold mb-2">Canlı QR Kod</h2>
      <p class="text-xs text-gray-500 mb-4">Her 10 saniyede bir yenilenir.</p>
      <div id="qrcode" class="flex justify-center my-4"></div>
      <div id="timer" class="text-sm font-semibold text-amber-800">Yenileniyor...</div>
    </div>

    <!-- 2. PERSONEL KAMERA TARAYICI VE İŞLEM -->
    <div id="scanner" class="screen hidden bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-lg font-bold mb-4 text-center">QR Kod Okutun</h2>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">PIN Kodunuz:</label>
        <input type="password" id="staff-pin" class="w-full border p-2 rounded text-center text-lg" placeholder="****">
      </div>
      
      <div id="reader" class="w-full"></div>

      <div id="action-buttons" class="hidden mt-4 space-y-2">
        <div class="p-3 bg-green-50 border border-green-200 text-green-700 rounded text-xs" id="qr-scanned-token">QR Başarıyla Taranmıştır.</div>
        <button onclick="submitShift('START')" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow">İŞE BAŞLAYALIM</button>
        <button onclick="submitShift('STOP')" class="w-full bg-red-600 text-white py-3 rounded-lg font-bold shadow">PAYDOS</button>
      </div>

      <div id="result-msg" class="mt-4 text-center font-semibold text-sm"></div>
    </div>

    <!-- 3. YÖNETİCİ PANELSİ -->
    <div id="admin" class="screen hidden bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-lg font-bold mb-4">Yönetici Paneli</h2>
      <form id="add-staff-form" onsubmit="addStaff(event)" class="space-y-3">
        <input type="text" id="new-name" placeholder="Personel Adı Soyadı" class="w-full border p-2 rounded" required>
        <input type="password" id="new-pin" placeholder="PIN Kodu" class="w-full border p-2 rounded" required>
        <input type="number" step="0.01" id="new-rate" placeholder="Saatlik Ücret (TL)" class="w-full border p-2 rounded" required>
        <button type="submit" class="w-full bg-amber-800 text-white py-2 rounded font-semibold">Personel Ekle</button>
      </form>
    </div>

  </div>

  <script>
    const API_URL = "https://personel-mesai-api.bratecoffee35.workers.dev";
    let scannedToken = "";

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      if (id === 'qr-display') startQrLoop();
      if (id === 'scanner') startScanner();
    }

    let qrInterval;
    function startQrLoop() {
      clearInterval(qrInterval);
      const fetchQr = async () => {
        const res = await fetch(`${API_URL}/api/qr/generate`);
        const data = await res.json();
        if (data.success) {
          document.getElementById('qrcode').innerHTML = "";
          new QRCode(document.getElementById("qrcode"), { text: data.token, width: 200, height: 200 });
        }
      };
      fetchQr();
      qrInterval = setInterval(fetchQr, 10000);
    }

    function startScanner() {
      const html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
        scannedToken = decodedText;
        document.getElementById('action-buttons').classList.remove('hidden');
        document.getElementById('reader').classList.add('hidden');
        html5QrCode.stop();
      }).catch(err => console.log(err));
    }

    async function submitShift(actionType) {
      const pin = document.getElementById('staff-pin').value;
      const msgDiv = document.getElementById('result-msg');
      if (!pin) { alert("Lütfen PIN kodunuzu girin!"); return; }

      msgDiv.innerText = "Konum alınıyor ve doğrulanıyor...";

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const res = await fetch(`${API_URL}/api/shift/action`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            pin_code: pin,
            token: scannedToken,
            user_lat: pos.coords.latitude,
            user_lng: pos.coords.longitude,
            action_type: actionType
          })
        });
        const data = await res.json();
        if (data.success) {
          msgDiv.className = "mt-4 text-center font-semibold text-sm text-green-600";
          msgDiv.innerText = data.message;
        } else {
          msgDiv.className = "mt-4 text-center font-semibold text-sm text-red-600";
          msgDiv.innerText = data.error;
        }
      }, (err) => {
        msgDiv.innerText = "Konum izni verilmeyen cihazlarda işlem yapılamaz.";
      });
    }

    async function addStaff(e) {
      e.preventDefault();
      const res = await fetch(`${API_URL}/api/admin/staff/add`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          full_name: document.getElementById('new-name').value,
          pin_code: document.getElementById('new-pin').value,
          hourly_rate: parseFloat(document.getElementById('new-rate').value)
        })
      });
      const data = await res.json();
      if(data.success) alert("Personel Eklendi!");
    }

    showScreen('qr-display');
  </script>
</body>
</html>
